cargo-features = ["profile-rustflags"]

[package]
name = "finalgo"
version = "0.1.0"
edition = "2024"
description = "A financial trading algorithm."
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ibapi = "5.0.0"
tokio = { version = "1.53.2", features = ["rt", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trading-calendar = "0.2.3"
chrono = "0.4.45"
time = "0.3.55"
indicatif = "0.18.6"
tracing-indicatif = "0.3.14"
rustc-hash = "2.1.3"
mimalloc = "0.1.52"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
